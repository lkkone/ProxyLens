# Cloud deployment: prebuilt image only; no source tree or compiler needed.
services:
  proxylens:
    image: ${PROXYLENS_IMAGE:-proxylens:0.1.0}
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8080}:8080"
    environment:
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8080}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?请在 .env 中设置 ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?请在 .env 中设置 ADMIN_PASSWORD}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
    volumes:
      - proxylens-data:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    read_only: true
    tmpfs:
      - /tmp:size=16m
    logging:
      options:
        max-size: "10m"
        max-file: "3"
volumes:
  proxylens-data:
